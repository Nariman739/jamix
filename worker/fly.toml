# Fly.io: воркер Jamiwa (WhatsApp + AI). Деплой из корня репо:
#   fly deploy -c worker/fly.toml --dockerfile worker/Dockerfile --remote-only --ha=false
# Секреты: fly secrets set -a jamiwa-worker DATABASE_URL=... WA_ENCRYPTION_KEY=... OPENROUTER_API_KEY=... \
#   TELEGRAM_BOT_TOKEN=... TELEGRAM_ADMIN_CHAT_ID=499592803
# Машина должна работать постоянно: WhatsApp держит WebSocket, засыпать нельзя.
# СТРОГО ОДНА МАШИНА: вторая поднимет те же номера → конфликт 440 на всех (нет аренды номеров между нодами).
app = "jamiwa-worker"
primary_region = "fra"

# SIGTERM + 30 с: воркер дописывает сессии всех номеров в базу перед остановкой (flush), 5 с по умолчанию мало
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# WORKER_NODE_KEY не задаём: воркер берёт hostname = id машины Fly, у каждой машины свой ключ

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[processes]
  app = "node dist/worker/src/index.js"

[[restart]]
  policy = "always"
